<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" role="img" aria-label="ChenyangLT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6fc"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#4f46e5"/>
      <stop offset="0.6" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gA"><stop offset="0" stop-color="#4f46e5" stop-opacity="0.55"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB"><stop offset="0" stop-color="#0891b2" stop-opacity="0.45"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC"><stop offset="0" stop-color="#db2777" stop-opacity="0.35"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="rgba(15,23,42,0.045)" stroke-width="1"/>
    </pattern>
    <style>
      .b1{animation:drift1 19s ease-in-out infinite}
      .b2{animation:drift2 24s ease-in-out infinite}
      .b3{animation:drift3 29s ease-in-out infinite}
      .cursor{animation:blink 1.1s steps(1,end) infinite}
      @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(34px,-22px)}}
      @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,18px)}}
      @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,26px)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @media (prefers-reduced-motion: reduce){.b1,.b2,.b3,.cursor{animation:none}}
    </style>
    <clipPath id="frame"><rect width="1180" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1180" height="300" fill="url(#bg)"/>
    <rect width="1180" height="300" fill="url(#grid)"/>
    <g opacity="0.28">
      <circle class="b1" cx="150" cy="40" r="200" fill="url(#gA)"/>
      <circle class="b2" cx="620" cy="300" r="230" fill="url(#gB)"/>
      <circle class="b3" cx="1080" cy="30" r="180" fill="url(#gC)"/>
    </g>

    <text x="72" y="98" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="3.4" fill="#4f46e5">// HELLO, WORLD</text>
    <text x="70" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="64" font-weight="800" letter-spacing="-1.6" fill="url(#name)">ChenyangLT</text>
    <text x="72" y="209" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="20" fill="#5b6779">高中生 · Vibe Coder · 喜欢把顺手的小工具做出来</text>

    <rect x="72" y="232" width="300" height="2" rx="1" fill="url(#rule)"/>

    <text x="72" y="266" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8a94a6">chenyang-blog.pages.dev</text>
    <circle cx="253" cy="262" r="2.5" fill="#8a94a6"/>
    <text x="267" y="266" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8a94a6">since 2023</text>

    <rect x="700" y="56" width="420" height="196" rx="14" fill="#ffffff" stroke="#dfe4ee" stroke-width="1"/>
    <circle cx="722" cy="77" r="5" fill="#ff5f57"/>
    <circle cx="740" cy="77" r="5" fill="#febc2e"/>
    <circle cx="758" cy="77" r="5" fill="#28c840"/>
    <text x="910" y="82" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8a94a6">zsh — chenyang@github</text>
    <line x1="700" y1="98" x2="1120" y2="98" stroke="#dfe4ee"/>
    <text x="726" y="130" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#0f172a"><tspan fill="#0891b2">$ </tspan>whoami</text>
    <text x="726" y="153" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#4f46e5">ChenyangLT</text>
    <text x="726" y="176" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#0f172a"><tspan fill="#0891b2">$ </tspan>ls ~/projects</text>
    <text x="726" y="199" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#5b6779">MusicBell  HoneySky  ECHO  meditrack</text>
    <text x="726" y="222" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#0f172a"><tspan fill="#0891b2">$ </tspan>echo $STATUS</text>
    <text x="726" y="245" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#0891b2">vibing · one commit at a time</text>
    <rect class="cursor" x="964" y="235" width="7" height="14" fill="#0891b2" opacity="0.9"/>
  </g>
</svg>
