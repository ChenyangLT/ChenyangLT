name: 刷新数据卡

on:
  schedule:
    - cron: "23 3 * * *"   # 每天 UTC 03:23（北京时间 11:23）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 生成 SVG
        run: node scripts/build.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 提交改动
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then echo "没有变化"; else git commit -m "chore: 刷新数据卡" && git push; fi
